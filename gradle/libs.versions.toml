[versions]
#Fabric check these on https://fabricmc.net/versions.html
minecraftVersion = "1.21"
yarnMappingsVersion = "1.21+build.2"
fabricLoaderVersion = "0.15.11"
fabricApiVersion = "0.100.1+1.21"
fabricLoomVersion = "1.6-SNAPSHOT"
#mods
modMenuVersion = "11.0.0-beta.2"
fabricKotlinVersion = "1.11.0+kotlin.2.0.0"
#other
nebulaVersion = "0.2.11a"
kotlinVersion = "2.0.0"

[libraries]
#Fabric
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraftVersion" }
yarnMappings = { group = "net.fabricmc", name = "yarn", version.ref = "yarnMappingsVersion" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoaderVersion" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApiVersion" }
#mods
modMenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modMenuVersion" }
fabricKotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabricKotlinVersion" }
#ohter
nebula = { group = "moe.forpleuvoir", name = "nebula", version.ref = "nebulaVersion" }

[plugins]
kotlinJVM = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
fabricLoom = { id = "fabric-loom", version.ref = "fabricLoomVersion" }