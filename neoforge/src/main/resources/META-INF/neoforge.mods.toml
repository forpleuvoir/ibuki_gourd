modLoader = "kotlinforforge"
loaderVersion = "${forge_kotlin_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/forpleuvoir/ibuki_gourd/issues"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/ibukigourd"
logoFile = "${mod_id}.png"
logoBlur = false
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[modproperties."${mod_id}"]
package = "moe.forpleuvoir.ibukigourd"

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"